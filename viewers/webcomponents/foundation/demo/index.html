<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Causeway interactive web components</title>
  <style>
    :root {
      --demo-accent: #145ea8;
      --demo-border: #b7c5d5;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 2rem;
      max-width: 60rem;
    }

    cw-object-header,
    cw-property,
    cw-action,
    cw-collection {
      display: block;
    }

    cw-property .causeway-property-label,
    cw-collection .causeway-collection-label {
      color: var(--demo-accent);
    }

    cw-action button {
      border: 1px solid var(--demo-border);
      border-radius: 0.4rem;
      padding: 0.4rem 0.75rem;
    }

    cw-collection .causeway-collection-table {
      border: 1px solid var(--demo-border);
    }
  </style>
</head>
<body>
  <main>
    <h1>Causeway rich GraphQL web components</h1>
    <p>This application-themed plain HTML page has no HTMX or frontend-framework dependency.</p>
    <output id="semantic-event" aria-live="polite">No semantic event</output>

    <cw-graphql-client endpoint="/graphql">
      <cw-object-context logical-type="university.dept.Department" object-id="1">
        <cw-object-header></cw-object-header>
        <cw-property member="name" editable></cw-property>
        <cw-property member="status" editable></cw-property>
        <cw-property member="chair"></cw-property>
        <cw-action member="inspect"></cw-action>
        <cw-interaction-controller></cw-interaction-controller>
        <cw-collection member="staffMembers">
          <cw-collection-column member="name" label="Name"></cw-collection-column>
          <cw-collection-column member="code" label="Code"></cw-collection-column>
        </cw-collection>
      </cw-object-context>
    </cw-graphql-client>
  </main>

  <script type="module">
    const components = await import('../src/index.mjs');
    components.installCausewayComponentStyles();

    const eventOutput = document.querySelector('#semantic-event');
    document.addEventListener('causeway-navigation-request', event => {
      eventOutput.value = `navigate:${event.detail.target.logicalTypeName}:${event.detail.target.id}`;
    });
    document.addEventListener('causeway-action-request', event => {
      eventOutput.value = `action:${event.detail.actionId}`;
    });
    document.addEventListener('causeway-property-updated', event => {
      eventOutput.value = `updated:${event.detail.member}`;
    });
    document.addEventListener('causeway-action-result', event => {
      eventOutput.value = `result:${event.detail.actionId}:${event.detail.result.kind}`;
    });
  </script>
</body>
</html>
