<article class="petclinic-page petclinic-dashboard" data-testid="petclinic-custom-home">
  <cw-object-header></cw-object-header>
  <div class="petclinic-dashboard-grid">
    <section aria-labelledby="petclinic-owner-heading">
      <h2 id="petclinic-owner-heading">Pet owners</h2>
      <cw-collection member="petOwners" label="Pet owners" active offset="0" size="10">
        <cw-collection-column member="name" label="Owner"></cw-collection-column>
        <cw-collection-column member="telephoneNumber" label="Telephone"></cw-collection-column>
        <cw-collection-column member="emailAddress" label="Email"></cw-collection-column>
      </cw-collection>
    </section>
    <section aria-labelledby="petclinic-visit-heading">
      <h2 id="petclinic-visit-heading">Upcoming visits</h2>
      <cw-collection member="futureVisits" label="Upcoming visits" active offset="0" size="10">
        <cw-collection-column member="visitAt" label="When"></cw-collection-column>
        <cw-collection-column member="reason" label="Reason"></cw-collection-column>
        <cw-collection-column member="notes" label="Notes"></cw-collection-column>
      </cw-collection>
    </section>
  </div>
</article>
