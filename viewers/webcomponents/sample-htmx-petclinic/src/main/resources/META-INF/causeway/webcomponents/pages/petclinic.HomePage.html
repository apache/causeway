<section class="causeway-route-page causeway-route-object" data-route-state="loading" data-page-kind="custom" data-page-source="resource" data-testid="causeway-route-page" tabindex="-1" aria-label="Object page">
  <cw-object-context logical-type="{{causeway.logicalType}}" object-id="{{causeway.objectId}}">
<article class="petclinic-page petclinic-dashboard" data-testid="petclinic-custom-home">
  <cw-object-header></cw-object-header>
  <div class="petclinic-dashboard-grid">
    <section aria-labelledby="petclinic-owner-heading">
      <h2 id="petclinic-owner-heading">Pet owners</h2>
      <cw-collection id="petOwners" label="Pet owners" active paged="5" sortable filterable>
        <cw-preview></cw-preview>
        <cw-collection-column id="name" label="Owner"></cw-collection-column>
        <cw-collection-column id="telephoneNumber" label="Telephone"></cw-collection-column>
        <cw-collection-column id="emailAddress" label="Email"></cw-collection-column>
      </cw-collection>
    </section>
    <section aria-labelledby="petclinic-visit-heading">
      <h2 id="petclinic-visit-heading">Upcoming visits</h2>
      <cw-collection id="futureVisits" named="Next appointments" active paged="10" filterable>
        <cw-preview></cw-preview>
        <cw-collection-column id="visitAt" label="When"></cw-collection-column>
        <cw-collection-column id="reason" label="Reason"></cw-collection-column>
        <cw-collection-column id="notes" label="Notes"></cw-collection-column>
      </cw-collection>
    </section>
  </div>
</article>
    <cw-interaction-controller data-causeway-route-interactions></cw-interaction-controller>
  </cw-object-context>
</section>
