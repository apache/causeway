<article class="petclinic-page petclinic-owner-page" data-testid="petclinic-owner-page">
  <cw-breadcrumbs data-testid="petclinic-breadcrumbs"></cw-breadcrumbs>
  <cw-object-header></cw-object-header>

  <div class="petclinic-page-toolbar" aria-label="Owner actions">
    <cw-action id="delete"></cw-action>
  </div>

  <div class="petclinic-object-grid">
    <div class="petclinic-object-details">
      <section class="petclinic-card" aria-labelledby="petclinic-owner-identity-heading">
        <h2 id="petclinic-owner-identity-heading">Identity</h2>
        <div class="petclinic-field-list">
          <cw-property id="name" named="Full name">
            <cw-action id="updateName"></cw-action>
          </cw-property>
          <cw-property id="knownAs" editable
                       described-as="The familiar or preferred name used by this owner."></cw-property>
        </div>
      </section>

      <section class="petclinic-card" aria-labelledby="petclinic-owner-contact-heading">
        <h2 id="petclinic-owner-contact-heading">Contact</h2>
        <div class="petclinic-field-list">
          <cw-property id="telephoneNumber" editable></cw-property>
          <cw-property id="emailAddress" editable></cw-property>
        </div>
      </section>

      <section class="petclinic-card" aria-labelledby="petclinic-owner-details-heading">
        <h2 id="petclinic-owner-details-heading">Details</h2>
        <div class="petclinic-field-list">
          <cw-property id="notes" editable multi-line="5"></cw-property>
          <cw-property id="lastVisit" editable label-position="TOP"></cw-property>
          <cw-property id="daysSinceLastVisit"></cw-property>
        </div>
      </section>
    </div>

    <div class="petclinic-object-collections">
      <section class="petclinic-card" aria-labelledby="petclinic-owner-pets-heading">
        <h2 id="petclinic-owner-pets-heading">Pets</h2>
        <cw-collection id="pets" named="Companion animals" active sortable>
          <cw-collection-column id="name" label="Name"></cw-collection-column>
          <cw-collection-column id="species" label="Species"></cw-collection-column>
          <cw-collection-column id="notes" label="Notes"></cw-collection-column>
          <cw-action id="addPet"></cw-action>
          <cw-action id="removePet"></cw-action>
        </cw-collection>
      </section>

      <section class="petclinic-card" aria-labelledby="petclinic-owner-visits-heading">
        <h2 id="petclinic-owner-visits-heading">Visits</h2>
        <cw-collection id="visits" named="Visit history"
                       described-as="All visits recorded for this owner's pets."
                       active paged="1">
          <cw-collection-column id="visitAt" label="When"></cw-collection-column>
          <cw-collection-column id="reason" label="Reason"></cw-collection-column>
          <cw-collection-column id="notes" label="Notes"></cw-collection-column>
          <cw-action id="bookVisit"></cw-action>
        </cw-collection>
      </section>
    </div>
  </div>
</article>
