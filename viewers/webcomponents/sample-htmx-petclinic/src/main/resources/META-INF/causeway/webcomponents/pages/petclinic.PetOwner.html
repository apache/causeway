<section class="causeway-route-page causeway-route-object" data-route-state="loading" data-page-kind="custom" data-page-source="resource" data-testid="causeway-route-page" tabindex="-1" aria-label="Object page">
  <cw-object-context logical-type="{{causeway.logicalType}}" object-id="{{causeway.objectId}}">
<article class="petclinic-page petclinic-owner-page" data-testid="petclinic-owner-page">
  <cw-action-results class="petclinic-card" data-testid="petclinic-action-results" hidden></cw-action-results>
  <cw-breadcrumbs data-testid="petclinic-breadcrumbs"></cw-breadcrumbs>
  <div class="petclinic-object-heading">
    <cw-object-header></cw-object-header>
    <div class="petclinic-page-toolbar" aria-label="Owner actions">
      <cw-action id="allOwners" named="Show all owners"></cw-action>
      <cw-action id="noOwners" named="Show empty owner result"></cw-action>
      <cw-action id="relatedOwners" named="Show related owners">
        <cw-standalone-collection named="Related owners">
          <cw-collection-column id="name" label="Owner"></cw-collection-column>
          <cw-collection-column id="knownAs" label="Known as"></cw-collection-column>
          <cw-collection-column id="notes" label="Notes"></cw-collection-column>
        </cw-standalone-collection>
      </cw-action>
      <cw-action id="delete" named="Remove this owner"></cw-action>
    </div>
  </div>

  <div class="petclinic-object-grid">
    <div class="petclinic-object-details">
      <section class="petclinic-card" aria-labelledby="petclinic-owner-identity-heading">
        <h2 id="petclinic-owner-identity-heading">Identity</h2>
        <div class="petclinic-field-list">
          <cw-property id="name" named="Full name">
            <cw-action id="updateName" named="Change the owner's name" prompt-style="INLINE">
              <cw-parameter id="name"
                            named="Owner's full name"
                            described-as="The complete name used to identify this pet owner."
                            description-as="tooltip"></cw-parameter>
            </cw-action>
          </cw-property>
          <cw-property id="knownAs" editable
                       described-as="The familiar or preferred name used by this owner."></cw-property>
        </div>
      </section>

      <section class="petclinic-card" aria-labelledby="petclinic-owner-contact-heading">
        <h2 id="petclinic-owner-contact-heading">Contact</h2>
        <div class="petclinic-field-list">
          <cw-property id="telephoneNumber" editable></cw-property>
          <cw-property id="emailAddress" editable></cw-property>
        </div>
      </section>

      <section class="petclinic-card" aria-labelledby="petclinic-owner-details-heading">
        <h2 id="petclinic-owner-details-heading">Details</h2>
        <div class="petclinic-field-list">
          <cw-property id="notes" editable multi-line="5"></cw-property>
          <cw-property id="lastVisit" editable label-position="TOP"
                       min="2000-01-01" max="today"></cw-property>
          <cw-property id="daysSinceLastVisit"></cw-property>
        </div>
      </section>
    </div>

    <div class="petclinic-object-collections">
      <section class="petclinic-card" aria-labelledby="petclinic-owner-pets-heading">
        <h2 id="petclinic-owner-pets-heading">Pets</h2>
        <cw-collection id="pets" named="Companion animals" active paged="5" sortable filterable>
          <cw-preview>
            <section class="petclinic-preview" aria-label="Pet preview">
              <cw-object-header></cw-object-header>
              <cw-property id="name"></cw-property>
              <cw-property id="species"></cw-property>
              <cw-property id="notes" editable multi-line="3"></cw-property>
              <cw-action id="clearNotes" named="Clear pet notes"></cw-action>
              <cw-collection id="visits" named="Pet visits" active paged="10">
                <cw-collection-column id="visitAt" label="When"></cw-collection-column>
                <cw-collection-column id="reason" label="Reason"></cw-collection-column>
              </cw-collection>
            </section>
          </cw-preview>
          <cw-collection-column id="name" label="Name"></cw-collection-column>
          <cw-collection-column id="species" label="Species"></cw-collection-column>
          <cw-collection-column id="notes" label="Notes"></cw-collection-column>
          <cw-action id="addPet" named="Register a pet" prompt-style="DIALOG_SIDEBAR">
            <cw-parameter id="name"
                          named="Pet name"
                          described-as="The name used for this companion animal."
                          description-as="label"></cw-parameter>
          </cw-action>
          <cw-action id="removePet"></cw-action>
        </cw-collection>
      </section>

      <section class="petclinic-card" aria-labelledby="petclinic-owner-visits-heading">
        <h2 id="petclinic-owner-visits-heading">Visits</h2>
        <cw-collection id="visits" named="Visit history"
                       described-as="All visits recorded for this owner's pets."
                       active paged="8">
          <cw-preview></cw-preview>
          <cw-collection-column id="visitAt" label="When"></cw-collection-column>
          <cw-collection-column id="reason" label="Reason"></cw-collection-column>
          <cw-collection-column id="notes" label="Notes"></cw-collection-column>
          <cw-action id="bookVisit" prompt-style="DIALOG_MODAL">
            <cw-parameter id="visitDate" min="tomorrow"></cw-parameter>
            <cw-parameter id="visitTime" min="08:00" max="17:00"></cw-parameter>
            <cw-parameter id="reason"
                          named="Reason for visit"
                          described-as="Describe the purpose of the appointment."
                          description-as="label"
                          multi-line="3"></cw-parameter>
          </cw-action>
        </cw-collection>
      </section>
    </div>
  </div>

  <section class="petclinic-card" aria-labelledby="petclinic-owner-documents-heading">
    <h2 id="petclinic-owner-documents-heading">Documents</h2>
    <cw-property id="pdfAuto" pdf-render="auto" pdf-initial-page="1" pdf-zoom="page-width" data-testid="petclinic-pdf-auto"></cw-property>
  </section>
</article>
    <cw-interaction-controller data-causeway-route-interactions></cw-interaction-controller>
  </cw-object-context>
</section>
