# The Java agent owns tracing. This profile requires its registry bridge and -javaagent.
spring.autoconfigure.exclude=org.springframework.boot.opentelemetry.autoconfigure.OpenTelemetrySdkAutoConfiguration,org.springframework.boot.micrometer.tracing.opentelemetry.autoconfigure.OpenTelemetryTracingAutoConfiguration,org.springframework.boot.micrometer.tracing.opentelemetry.autoconfigure.otlp.OtlpTracingAutoConfiguration,org.springframework.boot.micrometer.tracing.autoconfigure.MicrometerTracingAutoConfiguration
# Keep OTEL_* settings owned by the agent; do not map its metrics disable flag onto Micrometer.
management.opentelemetry.map-environment-variables=false
management.tracing.export.enabled=false
# Micrometer metrics remain enabled by application-observation.properties.
# Spring's discard predicate cannot filter spans exported by the agent.
causeway.observation.duration-filtering-enabled=false
