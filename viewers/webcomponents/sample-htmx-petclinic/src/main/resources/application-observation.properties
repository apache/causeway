# Local telemetry: Boot tracing by default; the agent profile replaces tracing ownership.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
# Micrometer owns metrics in both modes; send them to Prometheus, not Jaeger.
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=http://localhost:9090/api/v1/otlp/v1/metrics
management.otlp.metrics.export.step=10s
management.otlp.metrics.export.aggregation-temporality=cumulative
# Leave causeway.observation.* unset to verify the framework's default policy.
