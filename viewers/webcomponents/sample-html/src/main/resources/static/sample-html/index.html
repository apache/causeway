<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Causeway vanilla HTML web-component sample</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 2rem auto;
      max-width: 60rem;
      padding-inline: 1rem;
    }

    causeway-object-header,
    causeway-property {
      display: block;
      margin-block: 1rem;
    }

    .causeway-property-label {
      display: inline-block;
      font-weight: 600;
      min-width: 12rem;
    }

    .causeway-property-disabled-reason,
    [role="alert"] {
      display: block;
      margin-block-start: 0.25rem;
    }

    [role="alert"] {
      color: #b42318;
    }
  </style>
</head>
<body>
  <main data-testid="sample-app" data-state="booting" aria-busy="true">
    <h1>Causeway vanilla HTML web-component sample</h1>
    <p>This page uses native custom elements and ECMAScript modules against the same-origin rich GraphQL endpoint.</p>
    <output data-testid="sample-state" aria-live="polite">booting</output>

    <causeway-graphql-client endpoint="/graphql" data-testid="graphql-client">
      <causeway-object-context
          logical-type="causeway.webcomponents.sample.SampleObject"
          object-id="s_sample-1"
          data-testid="sample-object">
        <causeway-object-header data-testid="object-header"></causeway-object-header>
        <causeway-property member="name" data-testid="property-name"></causeway-property>
        <causeway-property member="code" data-testid="property-code"></causeway-property>
        <causeway-property member="secret" data-testid="property-secret"></causeway-property>
      </causeway-object-context>
    </causeway-graphql-client>
  </main>

  <script type="module">
    const application = document.querySelector('[data-testid="sample-app"]');
    const stateOutput = document.querySelector('[data-testid="sample-state"]');

    application.addEventListener('causeway-object-context-state-change', event => {
      const state = event.detail.state.status;
      application.dataset.state = state;
      application.setAttribute('aria-busy', String(state === 'schema-loading' || state === 'object-loading'));
      stateOutput.value = state;
    });

    await import('/causeway-webcomponents/index.mjs');
  </script>
</body>
</html>
