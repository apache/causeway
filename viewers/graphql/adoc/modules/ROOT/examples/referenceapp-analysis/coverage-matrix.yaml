schema:
  style: RICH_AND_SIMPLE
  queryType: SimpleAndRich
  mutationType: Mutation
  richLookupFields: 430
  mutationFields: 3154
  logicalTypeEnumValues: 277
  totalTypes: 21142
classifications:
  supported: The current public rich GraphQL contract satisfies the representative case.
  partial: A useful contract exists, but a confirmed limitation prevents complete generic use.
  gap: The expected framework-neutral contract is unavailable or incorrect.
  web-component: The protocol evidence is sufficient, but the reusable semantic component does not yet exist.
  viewer-specific: The behavior belongs to a host viewer or optional presentation policy.
  wicket-specific: The behavior is an implementation detail of the Wicket viewer and is not a framework-neutral requirement.
  server-only: The behavior is an execution or publishing concern and is not client metadata.
equivalenceClasses:
  scalarNative:
