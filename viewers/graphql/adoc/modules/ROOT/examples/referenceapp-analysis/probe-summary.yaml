probeEnvironment:
  referenceApplicationRevision: 04cff95802de44d0ff5ac0802857f3bb2ffe8c3a
  causewayRevision: local htmx branch at analysis execution
  causewayVersion: 4.0.0-SNAPSHOT
  java: 25.0.3
  endpoint: http://localhost:8080/graphql
  schemaStyle: RICH_AND_SIMPLE
  functionalProbeSecurity: explicit AuthorizorBypass chooser
  authorizationProbeSecurity: reference application Secman configuration
startupAdaptations:
  - Add the orphaned wicket/jpa-and-graphql directory to the root reactor.
  - Align its stale 3.4.0-SNAPSHOT parent with 4.0.0-SNAPSHOT.
  - Depend on wicket/jpa rather than the obsolete common-only assembly.
  - Use ReferenceAppWicketJpa rather than the obsolete DemoAppWicketJpa main class.
  - Import CausewayModuleViewerGraphqlViewer into the application configuration.
  - Keep the dependency JPA jar thin while repackaging the GraphQL application jar.
  - Exclude Spring Boot default logging from the GraphQL dependency to retain the application's Log4j2 binding.
  - Use -Dmaven.compiler.proc=full for Lombok under JDK 25.
  - Skip build-info because the orphaned module has no project description.
